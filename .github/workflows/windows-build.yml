name: windows-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (NSIS + Portable)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check & build frontend
        run: npm run build

      - name: Build Tauri bundle (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Verify build artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/target/release/fanssh.exe")) {
            throw "release 可执行文件不存在"
          }
          Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri/target/release/fanssh.exe" "portable/FanSSH.exe"
          # 存在此标记时，应用把配置与凭据写到 exe 同级的 data/ 目录
          New-Item -ItemType File -Force -Path "portable/portable.marker" | Out-Null
          Compress-Archive -Path "portable/*" -DestinationPath "FanSSH-portable-windows-x64.zip" -Force

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-portable-windows-x64
          path: FanSSH-portable-windows-x64.zip
          if-no-files-found: error

  release:
    name: Attach artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/fanssh-nsis-installer/*.exe
            dist-artifacts/fanssh-portable-windows-x64/*.zip
          draft: false
          generate_release_notes: true
