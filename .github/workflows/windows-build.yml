name: windows-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (NSIS + Portable)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check & build frontend
        run: npm run build

      - name: Enable updater artifacts
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          # 只有配置了签名私钥才生成更新包与 .sig，避免未配置密钥时构建失败
          $path = "src-tauri/tauri.conf.json"
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 $path

      - name: Build Tauri bundle (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Verify build artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/target/release/fanssh.exe")) {
            throw "release 可执行文件不存在"
          }
          Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri/target/release/fanssh.exe" "portable/FanSSH.exe"
          # 存在此标记时，应用把配置与凭据写到 exe 同级的 data/ 目录
          New-Item -ItemType File -Force -Path "portable/portable.marker" | Out-Null
          Compress-Archive -Path "portable/*" -DestinationPath "FanSSH-portable-windows-x64.zip" -Force

      - name: Generate latest.json
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到 NSIS 安装包" }
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) { throw "未找到签名文件 $sigFile" }
          $sig = (Get-Content $sigFile -Raw).Trim()
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $conf.version
          # 资产发布在公开更新通道仓库，tag 即版本号
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/$($exe.Name)"
          $notes = "FanSSH $version。安装版可在应用内「设置 → 检查更新」升级；便携版请下载新的便携包。"
          $latest = [ordered]@{
            version   = $version
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig; url = $assetUrl }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 latest.json
          Get-Content latest.json

      - name: Upload latest.json
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-latest-json
          path: latest.json
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-portable-windows-x64
          path: FanSSH-portable-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev \
            libfuse2 \
            patchelf \
            pkg-config \
            build-essential \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check & build frontend
        run: npm run build

      - name: Enable updater artifacts
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          # Linux 侧的 AppImage 也要生成 .sig，latest.json 才能带 linux-x86_64 通道
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Build Tauri bundle (AppImage + deb)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles appimage,deb

      - name: Verify build artifacts
        run: |
          ls -l src-tauri/target/release/bundle/appimage
          ls -l src-tauri/target/release/bundle/deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload AppImage signature
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-linux-appimage-sig
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: fanssh-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Attach artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    # 需要两边的签名产物：Windows 的 latest.json 与 Linux 的 AppImage.sig 合并成一份清单
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN != '' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Read version from latest.json
        id: meta
        if: env.HAS_SIGNING_KEY == 'true'
        run: echo "version=$(jq -r .version dist-artifacts/fanssh-latest-json/latest.json)" >> "$GITHUB_OUTPUT"

      - name: Add Linux platform to latest.json
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          set -euo pipefail
          version=$(jq -r .version dist-artifacts/fanssh-latest-json/latest.json)
          appimage=$(basename dist-artifacts/fanssh-linux-appimage/*.AppImage)
          sig=$(tr -d '\n' < dist-artifacts/fanssh-linux-appimage-sig/*.AppImage.sig)
          base="https://github.com/${{ github.repository }}/releases/download/v${version}"
          # 只追加 linux-x86_64 一项，Windows 的字段沿用 Windows 构建产物里的原值
          jq --arg sig "$sig" --arg url "${base}/${appimage}" \
            '.platforms["linux-x86_64"] = { signature: $sig, url: $url }' \
            dist-artifacts/fanssh-latest-json/latest.json > latest.json
          cat latest.json

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: FanSSH ${{ github.ref_name }}
          body: |
            Windows 终端与运维客户端 FanSSH 的 Windows x64 构建产物。

            ## 下载哪个文件

            | 文件 | 用途 |
            | --- | --- |
            | `FanSSH_*_x64-setup.exe` | NSIS 安装包：双击安装，写入 Program Files 与开始菜单快捷方式，适合长期使用 |
            | `FanSSH-portable-windows-x64.zip` | 便携版：解压即用，不写系统目录，适合拷到 U 盘或临时机器 |

            ## 便携版怎么用

            1. 把 zip 解压到任意目录（路径不要含中文或空格以外的特殊字符）。
            2. 直接双击 `FanSSH.exe` 运行，无需安装。
            3. 压缩包内的 `portable.marker` 会让应用把配置与加密凭据写到 exe 同级的 `data/` 目录；
               迁移或卸载时连同该目录一起带走/删除即可。
            4. 便携版不要与安装版共用同一个目录。

            ## 安装版说明

            - 安装包与便携版 exe 均**未做代码签名**。首次运行 Windows SmartScreen 可能提示
              “Windows 已保护你的电脑”，选择“更多信息”→“仍要运行”即可。
            - 凭据使用 Windows DPAPI 加密，与当前 Windows 用户绑定；换用户或换机器后需要重新录入密码。

            ## 本版本状态

            这是 v1 骨架的预览构建：SSH 终端、会话管理、SFTP、AI 侧边栏、内嵌 RDP 均已接入；
            仍存在已知缺口（SSH 未接 known_hosts、AI 非流式、RDP 剪贴板/多显示器/音频暂未接入等），详见仓库 README。
          files: |
            dist-artifacts/fanssh-nsis-installer/*.exe
            dist-artifacts/fanssh-portable-windows-x64/*.zip
            dist-artifacts/fanssh-linux-appimage/*.AppImage
            dist-artifacts/fanssh-linux-appimage-sig/*.AppImage.sig
            dist-artifacts/fanssh-linux-deb/*.deb
            latest.json
          draft: false
          make_latest: true
          generate_release_notes: true
