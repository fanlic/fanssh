[package]
name = "fanssh"
version = "1.0.8-preview.3"
description = "FanSSH - Windows terminal & operations client"
authors = ["FanSSH"]
edition = "2021"
rust-version = "1.94"

[lib]
name = "fanssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
encoding_rs = "0.8"
serialport = "4"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.9"
zeroize = "1"
bytes = "1"
des = "0.9"
log = "0.4"
env_logger = "0.11"

# 内嵌 RDP：Windows 与 Linux 共用同一套 ironrdp 协议栈。
ironrdp-session = "0.13.0"
ironrdp-connector = "0.12.0"
ironrdp-graphics = "0.11.0"
ironrdp-pdu = "0.11.0"
ironrdp-input = "0.9.0"
ironrdp-async = "0.12.0"
ironrdp-tokio = { version = "0.12.0", features = ["reqwest-rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_Credentials",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
